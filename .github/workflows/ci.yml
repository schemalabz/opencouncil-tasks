name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The fusion preflight spawns the built engine and the server refuses to
      # start without it, so two tests need dist/ to exist. The Dockerfile
      # builds; this job did not, and tested a tree that could never run.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t opencouncil-tasks:ci .
