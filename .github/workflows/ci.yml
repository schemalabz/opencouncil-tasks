name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t opencouncil-tasks:ci .

      # The Dockerfile fails the build when the watched-columns fix no longer applies.
      - name: Build PGSync image
        run: |
          docker build -t opencouncil/pgsync:ci docker/pgsync
          docker run --rm --entrypoint pip opencouncil/pgsync:ci show pgsync | grep '^Version'
