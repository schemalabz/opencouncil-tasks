# Gate for `eval gate fix.transcript <runA> <runB>`. Omitted keys fall back to the default gate.
#
# Only meaningful once human-tier holdout cases exist. Today every case is a recorded run whose
# expectations are that run's own corrections at tier `drafted`, which measure change, not
# correctness, so this gate prints NEEDS_REVIEW, never PASS. Users' UtteranceEdits from opencouncil
# become `imported` expectations (docs/evals.md, "What's needed for gate-grade cases").

# Too few human-backed cases to decide on: NEEDS_REVIEW until at least this many holdout cases carry them.
minHumanHoldoutCases: 5

# A meeting holds hundreds of utterances, so `utterance` is one family whose units are case × utterance.
# Any utterance on an imported/adjudicated holdout value that went from matching the human text to not
# matching it fails the gate, unless the family's regressions are within noiseFloorPp
# of its scored units.
maxHumanHoldoutRegressions: 0

# Largest allowed increase in cost per attempt over run A, in percent.
maxCostIncreasePct: 10
