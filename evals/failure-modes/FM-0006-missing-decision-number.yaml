id: FM-0006
slug: missing_decision_number
title: Decision extraction finds no decision number
definition: >
  The whole-document decision extraction returns no decisionNumber (Αριθμός Απόφασης).
  The pipeline's own MISSING_DECISION_NUMBER warning (validateRawExtraction / validateProcessedDecision), run as a check.
boundary: >
  Only the whole-document read (label decision-extraction) is checked: partial, continuation and closing reads of long documents leave fields empty by instruction, and their merged result is not a single call.
suite: decisions.extraction
scope: call
severity: minor
impact: visible
status: candidate
detector:
  kind: code
  module: src/evals/checks/decisionValidationCodes.ts
  export: MISSING_DECISION_NUMBER
decision: monitor
alert: "fail rate per city > 3× its 30-day baseline, min 5 decision-extraction calls"
