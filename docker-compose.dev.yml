services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src
      # The frozen policy the engine reads and hash-checks. Dockerfile.dev
      # copies no source at all, so without this mount FUSION_MODE=on refuses
      # to start. The engine itself is TypeScript and comes with ./src.
      - ./fusion:/app/fusion
      - ./.env:/app/.env
      - ./tsconfig.json:/app/tsconfig.json
      - ./secrets:/app/secrets
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=development
      - DO_SPACES_ENDPOINT=http://minio:9000
      - DO_SPACES_KEY=minioadmin
      - DO_SPACES_SECRET=minioadmin
      - DO_SPACES_BUCKET=opencouncil-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - opencouncil-net
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  
  # The fusion on its own port, speaking the OpenAI transcription API, for
  # anything that wants to use it as a provider without going through the task
  # runner. Same image, same engine, same frozen policy: only the entrypoint
  # differs, so there is no second copy of anything to drift.
  #
  #   docker compose -f docker-compose.dev.yml up fusion
  #   curl -H "Authorization: Bearer $API_TOKEN" -F file=@a.wav \
  #        -F model=fusion-rules http://localhost:3100/v1/audio/transcriptions
  #
  # Off unless asked for by name: `up` without arguments does not start it.
  fusion:
    profiles: ["fusion"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "start:fusion"]
    ports:
      - "3100:3100"
    volumes:
      - ./src:/app/src
      - ./fusion:/app/fusion
      - ./.env:/app/.env
      - ./tsconfig.json:/app/tsconfig.json
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=development
      - PORT=3100
      - FUSION_MODE=on
      - FUSION_OPENAI_ROUTE=on
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - opencouncil-net

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"      # API endpoint for external tools
      - "9001:9001"      # Web console for debugging
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - opencouncil-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - opencouncil-net
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing minio/opencouncil-dev;
      echo 'Bucket opencouncil-dev created or already exists';
      exit 0;
      "

volumes:
  minio_data:

networks:
  opencouncil-net:
    external: true